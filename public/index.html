<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Growth Toolkit — Dashboard</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235865f2'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/theme-tokens.css" />
    <link rel="stylesheet" href="/css/dashboard-shell.css" />
    <link rel="stylesheet" href="/css/dashboard-controls.css" />
    <link rel="stylesheet" href="/css/discord-message-preview.css" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar" hidden>
      <div class="brand">
        <span class="brand-mark">G</span>
        <span>Growth Toolkit</span>
      </div>

      <div class="status-pill">
        <span class="status-dot" id="bot-dot"></span>
        <span id="bot-status">đang kiểm tra…</span>
      </div>

      <a class="nav-item" data-route="servers" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="7" rx="2" />
          <rect x="3" y="13" width="18" height="7" rx="2" />
          <path d="M7 7.5h.01M7 16.5h.01" />
        </svg>
        <span>Server của bot</span>
      </a>
      <a class="nav-item" data-route="composer" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 20h4L20 8l-4-4L4 16v4z" />
          <path d="M14 6l4 4" />
        </svg>
        <span>Soạn nội dung</span>
      </a>
      <a class="nav-item" data-route="notify" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M18 15V10a6 6 0 10-12 0v5l-1.5 3h15L18 15z" />
          <path d="M10 21h4" />
        </svg>
        <span>Thông báo</span>
      </a>
      <a class="nav-item" data-route="analytics" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M3 20h18" />
          <path d="M6 20v-6M11 20V6M16 20v-9M21 20v-4" />
        </svg>
        <span>Thống kê</span>
      </a>
      <a class="nav-item" data-route="sources" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M10.5 13.5a4 4 0 005.7 0l2.3-2.3a4 4 0 00-5.7-5.7l-1.1 1.1" />
          <path d="M13.5 10.5a4 4 0 00-5.7 0l-2.3 2.3a4 4 0 005.7 5.7l1.1-1.1" />
        </svg>
        <span>Nguồn &amp; invite</span>
      </a>

      <div class="sidebar-footer">
        <div class="avatar sm" id="session-avatar">?</div>
        <div class="who">
          <strong id="session-user">…</strong>
          <span>quản trị</span>
        </div>
        <button class="ghost small" id="logout-button" title="Đăng xuất">Thoát</button>
      </div>
    </aside>

    <main id="main"></main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
